version: '3.8'

services:
  # PostgreFlow Node.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-form-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://myapp:arial123@192.168.1.40:5432/mydata}
      - SESSION_SECRET=${SESSION_SECRET:-postgreflow-proxmox-secret-key-32bytes}
      - NODE_ENV=production

  # Cloudflare Tunnel for Secure Internet Access (Zero Open Ports)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: postgres-form-tunnel
    restart: unless-stopped
    depends_on:
      - app
    # Named Tunnel Mode (permanent custom domain via Cloudflare Zero Trust Dashboard):
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    # Quick Tunnel Mode (zero config, generates free *.trycloudflare.com URL) — commented out:
    # command: tunnel --no-autoupdate --url http://app:3000
