version: '3.8'

services:
  # PostgreFlow Node.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postgres-form-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://myapp:arial123@192.168.1.40:5432/mydata}
      - NODE_ENV=production

  # Cloudflare Tunnel for Secure Internet Access (Zero Open Ports)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: postgres-form-tunnel
    restart: unless-stopped
    depends_on:
      - app
    # Quick Tunnel Mode (Zero config, generates free *.trycloudflare.com HTTPS URL in container logs):
    command: tunnel --no-autoupdate --url http://app:3000

    # Note: If you want a permanent custom domain via Cloudflare Zero Trust Dashboard,
    # comment out the command above, set TUNNEL_TOKEN in your environment, and use:
    # command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    # environment:
    #   - TUNNEL_TOKEN=${TUNNEL_TOKEN}
